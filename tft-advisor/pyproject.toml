[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-advisor"
version = "0.1.0"
description = "Personal real-time Teamfight Tactics advisor: screen capture + Claude vision + econ/odds engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yilou Wang" }]
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.7",
    "pillow>=10.0",
    "numpy>=1.26",
    "mss>=9.0",
]

[project.optional-dependencies]
# rapidocr-onnxruntime (1.3+) only supports Python < 3.13; newer Pythons get its
# maintained successor `rapidocr` 3.x, which needs onnxruntime listed explicitly.
ocr = [
    "rapidocr-onnxruntime>=1.3; python_version < '3.13'",
    "rapidocr>=3.4; python_version >= '3.13'",
    "onnxruntime>=1.17; python_version >= '3.13'",
]
voice = ["pyttsx3>=2.90"]
dev = ["pytest>=8.0"]
all = [
    "rapidocr-onnxruntime>=1.3; python_version < '3.13'",
    "rapidocr>=3.4; python_version >= '3.13'",
    "onnxruntime>=1.17; python_version >= '3.13'",
    "pyttsx3>=2.90",
    "pytest>=8.0",
]

[project.scripts]
tft-advisor = "tft_advisor.cli:main"

[tool.setuptools.packages.find]
include = ["tft_advisor*"]

[tool.setuptools.package-data]
tft_advisor = ["data/bundled/*.json", "data/bundled/*.toml", "data/bundled/*.md", "data/bundled/demo_s18/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
