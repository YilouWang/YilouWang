<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<title>TFT 实时助手</title>
<style>
:root {
  --bg: #0e1116;
  --card: #161b22;
  --card2: #1c222b;
  --line: #2a313c;
  --text: #e6edf3;
  --dim: #8b949e;
  --faint: #5c6570;
  --accent: #58a6ff;
  --good: #3fb950;
  --warn: #d29922;
  --bad: #f85149;
  --p1: #ff7b39;
  --req: #39c5cf;
  --c1: #a3acb9;
  --c2: #2fbf71;
  --c3: #3b8cff;
  --c4: #b264ff;
  --c5: #f5b301;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }

/* ---------- top bar ---------- */
/* banner + top bar stick together, so "connection lost" stays in view while scrolling */
.topwrap { position: sticky; top: 0; z-index: 20; }
.topbar {
  background: rgba(14, 17, 22, 0.96);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 10px; min-width: 64px; text-align: center;
}
.stat .k { display: block; font-size: 11px; color: var(--dim); line-height: 1.2; }
.stat .v { display: block; font-size: 20px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--dim); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill {
  display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px;
  border: 1px solid var(--line); background: var(--card); white-space: nowrap;
}
.pill.on { border-color: var(--good); color: var(--good); }
.pill.off { color: var(--dim); }
.pill.live { border-color: var(--good); color: var(--good); }
.pill.poll { border-color: var(--warn); color: var(--warn); }
.pill.down { border-color: var(--bad); color: var(--bad); }
.pill.busy { border-color: var(--accent); color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }

/* ---------- controls ---------- */
.controls {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;
  padding: 10px 16px 0; max-width: 1600px; margin: 0 auto;
}
.btn {
  border: 1px solid var(--line); background: var(--card2); border-radius: 10px;
  padding: 10px 8px; min-height: 48px; cursor: pointer; font-weight: 600; font-size: 16px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.98); background: #232a35; }
.btn .hk { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 4px; }
.btn.primary { background: #1f3b5c; border-color: #2f6fb0; }
.btn.danger { color: #ffb4ae; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn.req { background: #103a40; border-color: var(--req); color: #bff5f9; }
.btn.auto-on { border-color: var(--good); color: var(--good); }

/* ---------- grid ---------- */
main.grid {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px;
  padding: 12px 16px 24px; max-width: 1600px; margin: 0 auto; grid-auto-flow: row dense;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; min-width: 0;
}
.card h2 {
  margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--dim); letter-spacing: 0.5px;
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.card h2 .sub { font-weight: 400; font-size: 12px; color: var(--faint); }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w5 { grid-column: span 5; }
.w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
.empty { color: var(--faint); padding: 6px 0; }

/* ---------- headline ---------- */
.headline { border-color: #33415a; background: linear-gradient(180deg, #18202b, var(--card)); }
.hl-text { font-size: 30px; font-weight: 800; line-height: 1.25; margin: 2px 0 8px; word-break: break-word; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--card2);
  border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
}
.badge.llm { color: #d2a8ff; border-color: #6e40c9; }
.badge.stale { color: var(--warn); border-color: var(--warn); }
.actions { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.act {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 10px;
  background: var(--card2); border: 1px solid var(--line); border-left-width: 4px;
}
.act .tag { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: #252c36; color: var(--dim); white-space: nowrap; margin-top: 3px; }
.act .txt { font-size: 17px; word-break: break-word; }
.act.p1 { border-left-color: var(--p1); background: #2a1c14; }
.act.p1 .txt { font-size: 22px; font-weight: 800; color: #ffd9c4; }
.act.p1 .tag { background: var(--p1); color: #1b0f08; font-weight: 700; }
.act.p2 { border-left-color: var(--accent); }
.act.p3 { border-left-color: var(--line); opacity: 0.8; }
.act.p3 .txt { font-size: 15px; }
.plan { margin-top: 10px; font-size: 16px; }
.plan b { color: var(--dim); font-weight: 600; margin-right: 6px; }
.extra { margin-top: 8px; display: grid; gap: 4px; font-size: 15px; }
.extra div b { color: var(--dim); font-weight: 600; margin-right: 6px; }

/* ---------- requests ---------- */
.card.attention { border-color: var(--req); box-shadow: 0 0 0 1px var(--req) inset, 0 0 18px rgba(57, 197, 207, 0.18); }
.reqitem { border: 1px solid #1f5c62; background: #0f262a; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.reqitem .rt { font-size: 18px; font-weight: 700; color: #c9f6fa; word-break: break-word; }
.reqitem .rr { font-size: 13px; color: var(--dim); margin-top: 2px; }
.reqitem .rb { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.reqitem .rb .btn { flex: 1 1 auto; }

/* ---------- key/value rows ---------- */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: baseline; }
.kv .k { color: var(--dim); font-size: 13px; white-space: nowrap; }
.kv .v { font-size: 17px; font-weight: 600; }
.reco { font-size: 22px; font-weight: 800; margin: 2px 0 8px; }
.reason { color: var(--dim); font-size: 14px; margin-top: 8px; word-break: break-word; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px; border-radius: 7px; padding: 2px 8px;
  background: var(--card2); border: 1px solid var(--line); font-size: 14px; white-space: nowrap;
}
.chip.have { border-color: #2c6e3f; color: #b5f0c4; }
.chip.miss { color: var(--dim); border-style: dashed; }
.chip.pick { border-color: var(--good); background: #12301c; color: #c6f6d0; font-weight: 700; }
.chip.sell { border-color: #7a2d2a; color: #ffb4ae; }
.chip .st { color: var(--c5); font-size: 11px; letter-spacing: -1px; }
.cost1 { border-bottom: 2px solid var(--c1) !important; }
.cost2 { border-bottom: 2px solid var(--c2) !important; }
.cost3 { border-bottom: 2px solid var(--c3) !important; }
.cost4 { border-bottom: 2px solid var(--c4) !important; }
.cost5 { border-bottom: 2px solid var(--c5) !important; }
.lbl { color: var(--dim); font-size: 13px; margin: 8px 0 4px; }

/* ---------- shop ---------- */
.shop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.slot {
  border: 1px solid var(--line); border-radius: 9px; padding: 6px 4px; text-align: center;
  background: var(--card2); min-height: 52px; border-bottom-width: 3px; min-width: 0;
}
.slot .n { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .c { font-size: 12px; color: var(--dim); }
.slot.pick { background: #12301c; border-color: var(--good); box-shadow: 0 0 0 1px var(--good) inset; }
.slot.pick .n { color: #c6f6d0; }
.slot.none { opacity: 0.4; }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--dim); font-weight: 600; font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
td.unit { font-weight: 700; }
.pct-hi { color: var(--good); font-weight: 700; }
.pct-mid { color: var(--warn); font-weight: 700; }
.pct-lo { color: var(--bad); }

/* ---------- comps ---------- */
.comp { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: var(--card2); }
.comp .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.comp .name { font-size: 17px; font-weight: 800; word-break: break-word; }
.comp .score { font-size: 13px; color: var(--dim); white-space: nowrap; }
.bar { height: 5px; background: #0b0e12; border-radius: 3px; overflow: hidden; margin: 5px 0 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.contest { color: var(--bad); font-size: 13px; margin-top: 4px; }

/* ---------- items ---------- */
.item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.item .nm { font-weight: 700; font-size: 16px; }
.item .cp { color: var(--dim); font-size: 13px; }
.item .now { background: var(--p1); color: #1b0f08; border-radius: 6px; font-size: 12px; font-weight: 700; padding: 1px 6px; white-space: nowrap; margin-top: 2px; }

/* ---------- opponents ---------- */
.opp { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: var(--card2); }
.opp .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.opp .name { font-weight: 800; font-size: 16px; word-break: break-all; }
.players { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pl {
  border: 1px solid var(--line); background: var(--card2); border-radius: 8px; padding: 4px 8px;
  font-size: 13px; cursor: pointer; min-height: 36px; touch-action: manipulation;
}
.pl.me { border-color: var(--accent); cursor: default; }
.pl.seen { border-color: #2c6e3f; }
.pl.dead { opacity: 0.4; text-decoration: line-through; }

/* ---------- warnings / log ---------- */
.warnlist { margin: 0; padding-left: 18px; }
.warnlist li { margin: 3px 0; color: #f0c674; word-break: break-word; }
.warnlist li.bad { color: #ff8a80; }
.log { font-size: 13px; max-height: 260px; overflow-y: auto; font-family: ui-monospace, Consolas, "Microsoft YaHei", monospace; }
.log div { padding: 1px 0; word-break: break-word; }
.log .t { color: var(--faint); margin-right: 6px; }
.log .warn { color: var(--warn); }
.log .error { color: var(--bad); }

/* ---------- forms ---------- */
textarea, input[type=text], input[type=number], select {
  width: 100%; background: #0b0e12; border: 1px solid var(--line); border-radius: 9px;
  padding: 10px; font-size: 16px; min-height: 44px;
}
textarea { resize: vertical; min-height: 70px; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
textarea:disabled, .btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.row { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 110px; }
.row > .btn { flex: 0 0 auto; min-width: 88px; }
.answer { margin-top: 10px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; white-space: pre-wrap; word-break: break-word; font-size: 16px; }
.answer .q { color: var(--dim); font-size: 13px; margin-bottom: 4px; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50;
  background: #222a35; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px;
  font-size: 15px; opacity: 0; pointer-events: none; transition: opacity 0.2s; max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; }
#toast.ok { border-color: var(--good); }
#toast.warn { border-color: var(--warn); color: #f0c674; }
#toast.bad { border-color: var(--bad); color: #ffb4ae; }

#banner {
  display: none; background: #3b1d1d; color: #ffd0cc; border-bottom: 1px solid var(--bad);
  padding: 8px 16px; font-size: 14px;
}
#banner.show { display: block; }
/* connection lost: the data below is old, make that obvious at a glance */
main.grid.stale { opacity: 0.55; filter: grayscale(0.5); transition: opacity 0.3s; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .w3, .w4, .w5, .w6 { grid-column: span 6; }
  .w7, .w8, .w12 { grid-column: span 12; }
}
@media (max-width: 720px) {
  body { font-size: 15px; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .topwrap { position: static; }
  .topwrap.alert { position: sticky; top: 0; } /* phones: only pin the bar while something is wrong */
  .topbar { padding: 8px 12px; gap: 8px; }
  .brand { display: none; }
  .pill.info { display: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; width: 100%; }
  .stat { min-width: 0; padding: 3px 4px; }
  .stat .v { font-size: 18px; }
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: none;
    background: rgba(14, 17, 22, 0.97); border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px;
  }
  .btn { font-size: 15px; padding: 8px 2px; min-height: 54px; }
  .controls .btn .hk { display: none; }
  main.grid { padding: 10px 12px 16px; gap: 10px; }
  .w3, .w4, .w5, .w6, .w7, .w8, .w12 { grid-column: span 12; }
  .hl-text { font-size: 24px; }
  .act.p1 .txt { font-size: 20px; }
  #toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
  .shop { gap: 4px; }
  .slot .n { font-size: 13px; }
  .pl { min-height: 44px; padding: 6px 10px; }
}
</style>
</head>
<body>
<div class="topwrap" id="topwrap">
<div id="banner"></div>
<header class="topbar">
  <div class="brand">TFT 实时助手</div>
  <div class="stats">
    <div class="stat"><span class="k">阶段</span><span class="v" id="s-stage">-</span></div>
    <div class="stat"><span class="k">金币</span><span class="v" id="s-gold">-</span></div>
    <div class="stat"><span class="k">等级</span><span class="v" id="s-level">-</span></div>
    <div class="stat"><span class="k">血量</span><span class="v" id="s-hp">-</span></div>
    <div class="stat"><span class="k">连胜/连败</span><span class="v" id="s-streak">-</span></div>
    <div class="stat"><span class="k">自动分析</span><span class="v" id="s-auto">-</span></div>
    <div class="stat"><span class="k">API 调用</span><span class="v" id="s-calls">0</span></div>
    <div class="stat"><span class="k">连接</span><span class="v" id="s-conn">...</span></div>
  </div>
  <div class="pills" id="pills"></div>
</header>
</div>

<nav class="controls" id="controls">
  <button class="btn primary" data-cmd="analyze" data-label="分析">分析<span class="hk" id="hk-analyze">F6</span></button>
  <button class="btn" data-cmd="scout" data-label="记录对手">记录对手<span class="hk" id="hk-scout">F7</span></button>
  <button class="btn" data-cmd="shop" data-label="读商店">读商店<span class="hk" id="hk-shop">F9</span></button>
  <button class="btn" data-cmd="toggle_auto" data-label="自动开关" id="btn-auto">自动开关<span class="hk" id="hk-toggle_auto">F8</span></button>
  <button class="btn danger" data-cmd="new_game" data-label="新对局">新对局</button>
</nav>

<main class="grid">
  <section class="card headline w8" id="card-headline">
    <h2>当前建议 <span class="sub" id="hl-age"></span></h2>
    <div id="headline"><div class="hl-text">等待第一次分析</div><div class="dim">进入对局后会自动分析，也可以按 F6 或点「分析」。</div></div>
  </section>

  <section class="card w4" id="card-requests">
    <h2>需要你帮忙 <span class="sub" id="req-count"></span></h2>
    <div id="requests"><div class="empty">暂无请求</div></div>
  </section>

  <section class="card w4" id="card-econ">
    <h2>经济 <span class="sub" id="econ-sub"></span></h2>
    <div id="econ"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w4" id="card-shop">
    <h2>商店 <span class="sub">绿色 = 建议购买</span></h2>
    <div id="shop"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w4" id="card-comps">
    <h2>阵容推荐 <span class="sub">前 3</span></h2>
    <div id="comps"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w8" id="card-odds">
    <h2>搜牌概率 <span class="sub" id="odds-sub"></span></h2>
    <div id="odds"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w4" id="card-items">
    <h2>装备</h2>
    <div id="items"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w6" id="card-opponents">
    <h2>对手情报 <span class="sub">点玩家名 = 我正在看他的棋盘</span></h2>
    <div id="opponents"><div class="empty">还没有记录对手</div></div>
  </section>

  <section class="card w6" id="card-seen">
    <h2>识别结果 <span class="sub" id="seen-sub"></span></h2>
    <div id="seen"><div class="empty">暂无数据</div></div>
  </section>

  <section class="card w4" id="card-warnings">
    <h2>提醒</h2>
    <div id="warnings"><div class="empty">暂无提醒</div></div>
  </section>

  <section class="card w4" id="card-ask">
    <h2>问 Claude <span class="sub" id="ask-sub"></span></h2>
    <textarea id="ask-q" maxlength="500" placeholder="例如：现在该 D 牌还是存钱？"></textarea>
    <div class="row"><button class="btn primary" id="ask-btn">提问</button></div>
    <div id="answer"></div>
  </section>

  <section class="card w4" id="card-fix">
    <h2>手动修正 <span class="sub">识别错了就改这里</span></h2>
    <div class="row">
      <select id="fix-field" aria-label="字段">
        <option value="gold">金币</option>
        <option value="level">等级</option>
        <option value="hp">血量</option>
        <option value="stage">阶段</option>
        <option value="xp_current">当前经验</option>
        <option value="streak">连胜/连败</option>
      </select>
      <input type="text" id="fix-value" inputmode="numeric" placeholder="新数值" autocomplete="off">
      <button class="btn" id="fix-btn">修正</button>
    </div>
    <div class="lbl">目标阵容（留空 = 自动推荐）<span class="faint" id="comp-cur"></span></div>
    <div class="row">
      <input type="text" id="comp-value" list="comp-list" placeholder="例如：阿狸 或 法师" autocomplete="off">
      <datalist id="comp-list"></datalist>
      <button class="btn" id="comp-btn">设定</button>
    </div>
  </section>

  <section class="card w12" id="card-log">
    <h2>日志 <span class="sub" id="log-sub"></span></h2>
    <div class="log" id="log"><div class="faint">暂无日志</div></div>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ helpers
  var TOPICS = ["snapshot", "state", "analysis", "advice", "requests", "status", "log", "answer", "command"];
  var S = {};
  var skew = 0; // server time minus local time, seconds
  var lastAskTs = 0;
  var ASK_TIMEOUT_S = 120;
  var STALE_STREAM_MS = 45000; // server pings every 15 s; 3 missed pings = dead stream
  var lastMsgAt = 0;
  var lastDataAt = 0; // last time the server answered with data (stream event or poll)
  var SEND_TIMEOUT_MS = 6000; // a command that is not answered by then failed (never a silent queue)
  // Browsers allow about 6 connections per host: a hidden tab gives its stream
  // back, or a few forgotten dashboard tabs block every new page and command.
  var HIDDEN_PAUSE_MS = 3000;
  var COARSE = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
  var ASK_PLACEHOLDER = "例如：现在该 D 牌还是存钱？" + (COARSE ? "" : "（Ctrl+Enter 发送）");

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function g(obj, path, def) {
    var cur = obj;
    var parts = path.split(".");
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined || typeof cur !== "object") return def;
      cur = cur[parts[i]];
    }
    return cur === undefined || cur === null ? def : cur;
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function num(v) { return typeof v === "number" && isFinite(v) ? v : null; }
  function has(v) { return v !== null && v !== undefined && v !== ""; }
  function empty(text) { return '<div class="empty">' + esc(text) + "</div>"; }
  function nowS() { return Date.now() / 1000 + skew; }
  function stars(n) { n = Math.round(num(n) || 1); n = Math.max(1, Math.min(4, n)); return new Array(n + 1).join("★"); }
  // Only touch the DOM when the markup changed: re-rendering on every event
  // would reset scroll positions (odds table on a phone, log) and swallow taps
  // on buttons that get replaced between touchstart and click.
  function setHTML(id, html) {
    var el = typeof id === "string" ? $(id) : id;
    if (!el) return;
    if (el.__html === html) return;
    el.__html = html;
    el.innerHTML = html;
  }
  function pct(p) {
    p = num(p);
    if (p === null) return "-";
    var x = p * 100;
    if (x >= 99.5 && p < 1) return "&gt;99%";
    if (x > 0 && x < 0.5) return "&lt;1%";
    return Math.round(x) + "%";
  }
  function pctClass(p) {
    p = num(p);
    if (p === null) return "";
    return p >= 0.7 ? "pct-hi" : p >= 0.4 ? "pct-mid" : "pct-lo";
  }
  function fmtStage(st) {
    if (!st) return "";
    if (typeof st === "string") return st;
    if (typeof st === "object" && num(st.stage) !== null && num(st.round) !== null) return st.stage + "-" + st.round;
    return "";
  }
  function fmtAge(ts) {
    ts = num(ts);
    if (!ts) return "";
    var d = Math.max(0, nowS() - ts);
    if (d < 5) return "刚刚";
    if (d < 60) return Math.round(d) + " 秒前";
    if (d < 3600) return Math.round(d / 60) + " 分钟前";
    return Math.round(d / 3600) + " 小时前";
  }
  function fmtClock(ts) {
    ts = num(ts);
    if (!ts) return "";
    var dt = new Date((ts - skew) * 1000);
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    return p2(dt.getHours()) + ":" + p2(dt.getMinutes()) + ":" + p2(dt.getSeconds());
  }
  function norm(s) { return String(s || "").replace(/\s+/g, "").toLowerCase(); }
  function costCls(c) { c = num(c); return c && c >= 1 && c <= 5 ? " cost" + c : ""; }
  function unitName(u) {
    if (!u) return "";
    if (typeof u === "string") return u;
    return u.name || u.api_name || "?";
  }
  function unitChip(u, extra) {
    if (!u) return "";
    if (typeof u === "string") return '<span class="chip ' + (extra || "") + '">' + esc(u) + "</span>";
    var st = num(u.star) || 1;
    var items = arr(u.items);
    return '<span class="chip ' + (extra || "") + costCls(u.cost) + '">' + esc(unitName(u)) +
      (st > 1 ? '<span class="st">' + stars(st) + "</span>" : "") +
      (items.length ? '<span class="faint">+' + items.length + "</span>" : "") + "</span>";
  }

  var ACTION_LABEL = {
    buy: "购买", sell: "出售", level: "升级", roll: "搜牌", save: "存钱", item: "装备", position: "站位",
    pivot: "转型", scout: "侦察", augment: "海克斯", carousel: "选秀", other: "其他"
  };
  var PRIO_LABEL = { 1: "马上", 2: "本回合", 3: "可选" };
  var ECON_LABEL = {
    save: "存钱吃利息", level: "升级", roll: "搜牌", level_and_roll: "升级并搜牌",
    slow_roll: "慢搜（保留利息）", all_in: "全力搜牌保血", hold: "正常运营"
  };
  var SOURCE_LABEL = { rules: "规则引擎", llm: "Claude", "rules+llm": "规则 + Claude" };
  var PERCEIVER_LABEL = { claude: "Claude 识图", ocr: "本地 OCR", mock: "演示数据", manual: "手动输入", liveclient: "本地接口", list: "测试数据" };
  function perceiverLabel(p) {
    return String(p).split("+").map(function (x) { return PERCEIVER_LABEL[x] || x; }).join(" + ");
  }
  function dataSourceLabel(src) {
    src = String(src || "");
    if (src.indexOf("bundled-snapshot") === 0) return "内置快照";
    if (src.indexOf("bundled-sample") === 0) return "内置样例（不是当前赛季）";
    if (src.indexOf("cdragon") >= 0) return "CommunityDragon";
    return src;
  }
  function shopName(name) {
    // Set 18 Wisps are reported as "Wisp: <name>".
    return String(name).replace(/^\s*wisp\s*[:：]\s*/i, "精灵：");
  }
  var FIELD_LABEL = { gold: "金币", level: "等级", hp: "血量", stage: "阶段", xp_current: "当前经验", streak: "连胜/连败" };
  // Same bounds as engine/tracker.py (GOLD_RANGE, HP_RANGE, XP_MAX, STREAK_RANGE); the app has the final say.
  var FIELD_RANGE = { gold: [0, 300], level: [1, 10], hp: [0, 200], xp_current: [0, 200], streak: [-20, 20] };
  var FIX_HINT = { stage: "例如 3-2", streak: "连败填负数，如 -3" };

  // ------------------------------------------------------------------ network
  var TOKEN = (function () {
    var t = "";
    try { t = new URLSearchParams(location.search).get("token") || ""; } catch (e) { t = ""; }
    if (t) {
      try { localStorage.setItem("tftAdvisorToken", t); } catch (e) { /* storage may be blocked */ }
      return t;
    }
    try { return localStorage.getItem("tftAdvisorToken") || ""; } catch (e) { return ""; }
  })();

  function api(path) {
    if (!TOKEN) return path;
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
  }
  function headers(json) {
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    if (TOKEN) h["X-Token"] = TOKEN;
    return h;
  }

  var toastTimer = null;
  function toast(text, kind, ms) {
    var el = $("toast");
    el.textContent = text;
    el.className = "show " + (kind || "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, ms || (kind === "ok" ? 2200 : 4500));
  }
  function banner(text) {
    var el = $("banner");
    if (el.textContent !== (text || "")) el.textContent = text || "";
    el.className = text ? "show" : "";
    $("topwrap").classList.toggle("alert", !!text);
  }
  function agoText(ms) {
    var d = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return d < 60 ? d + " 秒前" : d < 3600 ? Math.round(d / 60) + " 分钟前" : Math.round(d / 3600) + " 小时前";
  }
  // One place decides the banner and the "old data" look of the page.
  function refreshBanner() {
    var down = connMode === "down";
    var grid = document.querySelector("main.grid");
    if (grid) grid.classList.toggle("stale", down && lastDataAt > 0);
    if (authBad) {
      banner("访问被拒绝：需要令牌。请用助手启动时打印的完整链接（带 ?token=）打开本页。");
    } else if (down) {
      banner(lastDataAt
        ? "与助手的连接已断开，下面是 " + agoText(lastDataAt) + "的数据，正在重连..."
        : "连不上助手，请确认 tft-advisor 正在运行，正在重试...");
    } else {
      banner("");
    }
  }

  // failPrefix: what a refused command is called in the toast ("修正失败" ...).
  function send(payload, label, failPrefix) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, SEND_TIMEOUT_MS) : null;
    var opts = { method: "POST", headers: headers(true), body: JSON.stringify(payload), cache: "no-store" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(api("/api/command"), opts)
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (r.status === 401) authFailed();
          if (j && j.rejected && j.error) {
            toast((failPrefix || "未执行") + "：" + j.error, "bad", 6000);
            return false;
          }
          if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
          var warns = arr(j.warnings);
          if (warns.length) toast("已发送：" + label + "。注意：" + warns[0], "warn", 6000);
          else toast("已发送：" + label, "ok");
          return true;
        });
      })
      .catch(function (e) {
        var why = e && e.name === "AbortError" ? "连接超时" :
          e instanceof TypeError ? "连不上助手" : (e && e.message ? e.message : String(e));
        toast("发送失败：" + why, "bad");
        return false;
      })
      .then(function (ok) { clearTimeout(timer); return ok; });
  }

  var es = null;
  var backoff = 1000;
  var reconnectTimer = null;
  var pollTimer = null;
  var connMode = "";
  var authBad = false;

  function setConn(mode) {
    connMode = mode;
    var el = $("s-conn");
    var map = { live: ["实时", "good"], poll: ["轮询", "warn"], down: ["断开", "bad"], auth: ["令牌错误", "bad"], paused: ["暂停", "dim"] };
    var m = map[mode] || ["...", ""];
    el.textContent = m[0];
    el.className = "v " + m[1];
    refreshBanner();
  }
  function authFailed() {
    authBad = true;
    setConn("auth");
  }
  function pageHidden() { return document.visibilityState === "hidden"; }

  function syncClock() {
    fetch(api("/api/health"), { headers: headers(false), cache: "no-store" })
      .then(function (r) { if (r.status === 401) { authFailed(); return null; } return r.ok ? r.json() : null; })
      .then(function (j) { if (j && num(j.ts)) skew = j.ts - Date.now() / 1000; })
      .catch(function () { /* ignore */ });
  }

  function handle(topic, raw) {
    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    lastDataAt = Date.now();
    if (topic === "snapshot") {
      S = data && typeof data === "object" ? data : {};
    } else if (topic === "log") {
      var lg = arr(S.log).slice(-199);
      for (var i = Math.max(0, lg.length - 5); i < lg.length; i++) {
        var x = lg[i];
        if (x && data && x.ts === data.ts && x.text === data.text) return;
      }
      lg.push(data);
      S.log = lg;
    } else if (topic === "command") {
      return;
    } else {
      S[topic] = data;
    }
    if (authBad) { authBad = false; refreshBanner(); }
    scheduleRender();
  }

  function poll() {
    if (pageHidden()) return; // nobody is looking; visibilitychange refreshes
    fetch(api("/api/snapshot"), { headers: headers(false), cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) { authFailed(); return null; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        if (es && es.readyState === 1 && connMode === "live") return; // the stream is fresher
        S = j;
        lastDataAt = Date.now();
        if (authBad) authBad = false;
        if (!es || es.readyState !== 1) setConn("poll");
        else refreshBanner();
        scheduleRender();
      })
      .catch(function () { if ((!es || es.readyState !== 1) && connMode !== "paused") setConn("down"); });
  }
  function startPolling() {
    if (pollTimer || pageHidden()) return;
    poll();
    pollTimer = setInterval(poll, 2000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // Hidden tab: close the stream and stop polling, so forgotten dashboard tabs
  // never hold the browser's few connections to this host.
  function pauseStream() {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    if (es) { try { es.close(); } catch (e) { /* ignore */ } es = null; }
    stopPolling();
    setConn("paused");
  }

  function connect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    if (es) { try { es.close(); } catch (e) { /* ignore */ } es = null; }
    if (pageHidden()) { pauseStream(); return; } // resumed by visibilitychange
    if (!window.EventSource) { startPolling(); return; }
    var src;
    try { src = new EventSource(api("/api/events")); } catch (e) { sseFailed(); return; }
    es = src;
    src.onopen = function () {
      if (es !== src) return;
      backoff = 1000;
      setConn("live");
      stopPolling();
      syncClock();
    };
    src.onerror = function () {
      if (es !== src) return;
      try { src.close(); } catch (e) { /* ignore */ }
      es = null;
      sseFailed();
    };
    lastMsgAt = Date.now();
    TOPICS.forEach(function (t) {
      src.addEventListener(t, function (ev) { if (es === src) { lastMsgAt = Date.now(); handle(t, ev.data); } });
    });
    src.addEventListener("ping", function () { if (es === src) lastMsgAt = lastDataAt = Date.now(); });
  }
  // A phone that switched Wi-Fi or slept can keep a dead stream "open" forever.
  setInterval(function () {
    if (es && es.readyState === 1 && Date.now() - lastMsgAt > STALE_STREAM_MS) {
      backoff = 1000;
      connect();
      poll();
    }
  }, 10000);
  function sseFailed() {
    if (pageHidden()) { pauseStream(); return; }
    startPolling();
    if (connMode !== "auth") setConn(connMode === "down" ? "down" : "poll");
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30000);
  }

  var hiddenAt = 0;
  var hideTimer = null;
  document.addEventListener("visibilitychange", function () {
    if (pageHidden()) {
      hiddenAt = Date.now();
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { if (pageHidden()) pauseStream(); }, HIDDEN_PAUSE_MS);
      return;
    }
    clearTimeout(hideTimer);
    hideTimer = null;
    var away = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = 0;
    if (!es || es.readyState === 2 || connMode === "paused" || away > 20000) {
      backoff = 1000;
      connect(); // after a long sleep the old stream is often dead without an error
      poll();
    }
  });

  // ------------------------------------------------------------------ render
  var renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    raf(function () { renderQueued = false; render(); });
  }
  function safe(name, fn) {
    try { fn(); } catch (e) {
      if (window.console) console.error("render " + name, e);
    }
  }
  function render() {
    safe("top", renderTop);
    safe("headline", renderHeadline);
    safe("requests", renderRequests);
    safe("econ", renderEcon);
    safe("shop", renderShop);
    safe("odds", renderOdds);
    safe("comps", renderComps);
    safe("items", renderItems);
    safe("opponents", renderOpponents);
    safe("seen", renderSeen);
    safe("warnings", renderWarnings);
    safe("answer", renderAnswer);
    safe("ask", renderAsk);
    safe("log", renderLog);
  }

  function setText(id, html, cls) {
    var el = $(id);
    if (!el) return;
    setHTML(el, html);
    if (cls !== undefined && el.className !== "v " + cls) el.className = "v " + cls;
  }

  function renderTop() {
    var st = S.state || {};
    var status = S.status || {};
    var stage = fmtStage(st.stage) || g(S, "analysis.stage", "");
    setText("s-stage", esc(stage || "-"));
    var gold = num(st.gold);
    setText("s-gold", gold === null ? "-" : String(gold), gold !== null && gold >= 50 ? "good" : "");
    var lvl = num(st.level);
    var xp = num(st.xp_current), xpn = num(st.xp_needed);
    setText("s-level", lvl === null ? "-" : lvl + (xp !== null && xpn ? " <small>" + xp + "/" + xpn + "</small>" : ""));
    var hp = num(st.hp);
    setText("s-hp", hp === null ? "-" : String(hp), hp === null ? "" : hp <= 30 ? "bad" : hp <= 50 ? "warn" : "");
    var sk = num(st.streak);
    setText("s-streak", sk === null || sk === 0 ? "-" : sk > 0 ? "胜 " + sk : "败 " + (-sk), sk > 0 ? "good" : sk < 0 ? "bad" : "");
    if (status.auto === true || status.auto === false) {
      setText("s-auto", status.auto ? "开" : "关", status.auto ? "good" : "dim");
      $("btn-auto").className = "btn" + (status.auto ? " auto-on" : "");
    }
    var calls = num(status.calls);
    if (calls === null) calls = num(g(status, "llm_stats.calls", null));
    var cost = num(g(status, "llm_stats.cost_usd", null));
    setText("s-calls", (calls === null ? "0" : String(calls)) + (cost !== null && cost > 0 ? " <small>约 $" + cost.toFixed(2) + "</small>" : ""));
    var hint = typeof status.comp_hint === "string" ? status.comp_hint : null;
    if (hint !== null) {
      $("comp-cur").textContent = hint ? "：当前 " + hint : "：当前 自动";
      var inp = $("comp-value");
      if (inp && document.activeElement !== inp && !inp.value && hint) inp.value = hint;
    }

    var pills = [];
    if (status.busy) pills.push('<span class="pill busy">分析中...</span>');
    if (status.perceiver) pills.push('<span class="pill off info">识别: ' + esc(perceiverLabel(status.perceiver)) + "</span>");
    if (status.set) pills.push('<span class="pill off info">' + esc(status.set) + "</span>");
    if (status.llm === false) pills.push('<span class="pill off">未启用 Claude</span>');
    setHTML("pills", pills.join(""));

    var hk = status.hotkeys || {};
    ["analyze", "scout", "shop", "toggle_auto"].forEach(function (k) {
      if (hk[k] && $("hk-" + k)) $("hk-" + k).textContent = hk[k];
    });
  }

  function waitingHTML() {
    var key = g(S, "status.hotkeys.analyze", "F6");
    return '<div class="hl-text">等待第一次分析</div><div class="dim">进入对局后会自动分析，也可以按 ' + esc(key) + " 或点「分析」。</div>";
  }

  function renderHeadline() {
    var adv = S.advice;
    var el = $("headline");
    if (!adv || typeof adv !== "object" || !has(adv.headline)) {
      // Really render the placeholder: a snapshot without advice (fresh app on
      // the same port after a restart) must not leave the last session's advice up.
      setHTML(el, waitingHTML());
      $("hl-age").textContent = "";
      return;
    }
    var badges = [];
    var src = adv.source || "rules";
    badges.push('<span class="badge' + (src.indexOf("llm") >= 0 ? " llm" : "") + '">' + esc(SOURCE_LABEL[src] || src) + "</span>");
    var conf = num(adv.confidence);
    if (conf !== null) badges.push('<span class="badge">把握 ' + Math.round(conf * 100) + "%</span>");
    var curStage = fmtStage(g(S, "state.stage", null));
    if (adv.stage) {
      var stale = curStage && adv.stage !== curStage;
      badges.push('<span class="badge' + (stale ? " stale" : "") + '">' + (stale ? "旧建议 " : "回合 ") + esc(adv.stage) + "</span>");
    }
    var acts = arr(adv.actions).slice().sort(function (a, b) {
      return (num(a && a.priority) || 2) - (num(b && b.priority) || 2);
    });
    var list = acts.map(function (a) {
      if (!a) return "";
      var p = num(a.priority) || 2;
      p = Math.max(1, Math.min(3, p));
      var tag = (ACTION_LABEL[a.type] || "") + (ACTION_LABEL[a.type] ? " · " : "") + PRIO_LABEL[p];
      return '<li class="act p' + p + '"><span class="tag">' + esc(tag) + '</span><span class="txt">' + esc(a.text) + "</span></li>";
    }).join("");
    var extra = [];
    if (has(adv.comp)) extra.push("<div><b>阵容</b>" + esc(adv.comp) + "</div>");
    if (has(adv.items)) extra.push("<div><b>装备</b>" + esc(adv.items) + "</div>");
    if (has(adv.positioning)) extra.push("<div><b>站位</b>" + esc(adv.positioning) + "</div>");
    if (has(adv.augment)) extra.push("<div><b>海克斯</b>" + esc(adv.augment) + "</div>");
    if (has(adv.scout_request)) extra.push('<div class="warn"><b>需要信息</b>' + esc(adv.scout_request) + "</div>");
    setHTML(el,
      '<div class="hl-text">' + esc(adv.headline) + "</div>" +
      '<div class="badges">' + badges.join("") + "</div>" +
      (list ? '<ul class="actions">' + list + "</ul>" : "") +
      (has(adv.plan) ? '<div class="plan"><b>计划</b>' + esc(adv.plan) + "</div>" : "") +
      (extra.length ? '<div class="extra">' + extra.join("") + "</div>" : ""));
    $("hl-age").textContent = fmtAge(adv.created_at);
  }

  function currentRequests() {
    if (Array.isArray(S.requests)) return S.requests;
    return arr(g(S, "analysis.scout_requests", []));
  }

  function renderRequests() {
    var reqs = currentRequests().filter(function (r) { return r && typeof r === "object"; });
    var card = $("card-requests");
    card.className = "card w4" + (reqs.length ? " attention" : "");
    $("req-count").textContent = reqs.length ? reqs.length + " 条" : "";
    if (!reqs.length) { setHTML("requests", empty("暂无请求")); return; }
    setHTML("requests", reqs.map(function (r, i) {
      return '<div class="reqitem"><div class="rt">' + esc(r.text || ("请切到 " + (r.target_player || "对手") + " 的棋盘")) + "</div>" +
        (has(r.reason) ? '<div class="rr">' + esc(r.reason) + "</div>" : "") +
        '<div class="rb"><button class="btn req" data-req-scout="' + i + '" data-player="' + esc(r.target_player || "") + '">我已切到他的棋盘，记录</button>' +
        '<button class="btn small" data-req-dismiss="' + i + '" data-id="' + esc(r.id || "") + '">忽略</button></div></div>';
    }).join(""));
  }

  function renderEcon() {
    var e = g(S, "analysis.econ", null);
    if (!e || typeof e !== "object") { setHTML("econ", empty("暂无数据")); $("econ-sub").textContent = ""; return; }
    var reco = e.recommendation ? (ECON_LABEL[e.recommendation] || e.recommendation) : "";
    var rows = [];
    function row(k, v) { if (has(v)) rows.push('<span class="k">' + esc(k) + '</span><span class="v">' + v + "</span>"); }
    row("利息", num(e.interest) !== null ? "+" + e.interest : "");
    row("连胜/连败金币", num(e.streak_gold) ? "+" + e.streak_gold : "");
    row("下回合收入", num(e.expected_income) !== null ? "+" + e.expected_income + ' <span class="dim" style="font-size:12px">(不含胜场)</span>' : "");
    row("搜牌预算", num(e.roll_budget) !== null ? e.roll_budget + " 金" + (e.roll_budget > 0 ? ' <span class="dim" style="font-size:12px">(约 ' + Math.floor(e.roll_budget / 2) + " 次)</span>" : "") : "");
    row("升级还差", num(e.gold_to_next_level) !== null ? e.gold_to_next_level + " 金" + (num(e.xp_to_next) !== null ? ' <span class="dim" style="font-size:12px">(' + e.xp_to_next + " 经验)</span>" : "") : "");
    row("目标等级", num(e.target_level) !== null ? String(e.target_level) : "");
    setHTML("econ",
      (reco ? '<div class="reco">' + esc(reco) + "</div>" : "") +
      (rows.length ? '<div class="kv">' + rows.join("") + "</div>" : "") +
      (has(e.reason) ? '<div class="reason">' + esc(e.reason) + "</div>" : ""));
    $("econ-sub").textContent = num(e.gold) !== null ? "按 " + e.gold + " 金计算" : "";
  }

  function renderShop() {
    var st = S.state || {};
    var an = S.analysis || {};
    var picks = arr(an.shop_picks).map(norm);
    var units = arr(st.shop_units);
    var slots = arr(st.shop);
    var n = Math.max(units.length, slots.length);
    var html = "";
    if (n) {
      var cells = [];
      for (var i = 0; i < Math.min(n, 6); i++) {
        var u = units[i] || null;
        var s = slots[i] || null;
        var name = (u && (u.name || u.api_name)) || (s && s.name) || "";
        var cost = (u && num(u.cost)) || (s && num(s.cost)) || null;
        if (!name) { cells.push('<div class="slot none"><div class="n">空</div></div>'); continue; }
        var isPick = picks.indexOf(norm(name)) >= 0 || (u && picks.indexOf(norm(u.api_name)) >= 0);
        cells.push('<div class="slot' + (isPick ? " pick" : "") + costCls(cost) + '"><div class="n">' + esc(shopName(name)) +
          '</div><div class="c">' + (cost ? cost + " 费" : "") + "</div></div>");
      }
      html += '<div class="shop">' + cells.join("") + "</div>";
    }
    var buy = arr(an.shop_picks), sell = arr(an.sell_candidates);
    html += '<div class="lbl">建议购买</div>' + (buy.length ? '<div class="chips">' + buy.map(function (x) { return '<span class="chip pick">' + esc(unitName(x)) + "</span>"; }).join("") + "</div>" : empty("无"));
    html += '<div class="lbl">可以出售</div>' + (sell.length ? '<div class="chips">' + sell.map(function (x) { return '<span class="chip sell">' + esc(unitName(x)) + "</span>"; }).join("") + "</div>" : empty("无"));
    setHTML("shop", html);
  }

  function goldKeys(odds) {
    var seen = {};
    odds.forEach(function (o) {
      Object.keys((o && o.p_goal_by_gold) || {}).forEach(function (k) { var v = Number(k); if (isFinite(v)) seen[v] = true; });
    });
    var keys = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
    if (!keys.length) return [20, 40, 60];
    if ([20, 40, 60].every(function (k) { return seen[k]; })) return [20, 40, 60];
    return keys.slice(0, 4);
  }

  function renderOdds() {
    var odds = arr(g(S, "analysis.odds", [])).filter(function (o) { return o && typeof o === "object"; });
    if (!odds.length) { setHTML("odds", empty("还没有需要追的棋子")); $("odds-sub").textContent = ""; return; }
    var keys = goldKeys(odds);
    var lvl = num(odds[0].level);
    $("odds-sub").textContent = lvl ? "按 " + lvl + " 级商店概率" : "";
    var head = "<tr><th>英雄</th><th>费</th><th>已有/需要</th><th>目标</th><th>单次商店</th>" +
      keys.map(function (k) { return "<th>" + k + " 金</th>"; }).join("") + "<th>期望花费</th><th>池中剩余</th></tr>";
    var body = odds.slice(0, 12).map(function (o) {
      var pg = o.p_goal_by_gold || {};
      var cells = keys.map(function (k) {
        var p = pg[k] !== undefined ? pg[k] : pg[String(k)];
        return '<td class="' + pctClass(p) + '">' + pct(p) + "</td>";
      }).join("");
      var eg = num(o.expected_gold_to_goal);
      var seenEl = num(o.seen_elsewhere);
      return '<tr><td class="unit' + costCls(o.cost) + '">' + esc(o.unit || o.api_name) + "</td>" +
        "<td>" + (num(o.cost) || "-") + "</td>" +
        "<td>" + (num(o.owned_copies) !== null ? o.owned_copies : "-") + "/" + (num(o.goal_copies) !== null ? o.goal_copies : "-") + "</td>" +
        '<td style="color:var(--c5)">' + stars(o.goal_star) + "</td>" +
        "<td>" + pct(o.p_in_shop) + "</td>" + cells +
        "<td>" + (eg === null ? "-" : "约 " + Math.round(eg) + " 金") + "</td>" +
        "<td>" + (num(o.remaining_in_pool) !== null ? o.remaining_in_pool : "-") +
        (seenEl ? ' <span class="faint">(别人 ' + seenEl + ")</span>" : "") + "</td></tr>";
    }).join("");
    setHTML("odds", '<div class="tablewrap"><table><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>");
  }

  function renderComps() {
    var comps = arr(g(S, "analysis.comps", [])).filter(function (c) { return c && typeof c === "object"; }).slice(0, 3);
    var dl = $("comp-list");
    var names = arr(g(S, "status.comp_names", [])).filter(has);
    if (!names.length) names = comps.map(function (c) { return c.name; });
    setHTML(dl, names.map(function (n) { return '<option value="' + esc(n) + '">'; }).join(""));
    if (!comps.length) { setHTML("comps", empty("暂无数据")); return; }
    setHTML("comps", comps.map(function (c) {
      var sc = num(c.score);
      var have = arr(c.have_units), miss = arr(c.missing_units), cont = arr(c.contested_by);
      var carryItems = arr(c.carry_items);
      return '<div class="comp"><div class="top"><span class="name">' + esc(c.name) + '</span><span class="score">契合 ' +
        (sc === null ? "-" : Math.round(sc * 100) + "%") + "</span></div>" +
        '<div class="bar"><i style="width:' + (sc === null ? 0 : Math.max(0, Math.min(100, sc * 100))) + '%"></i></div>' +
        (has(c.carry) ? '<div style="font-size:14px"><b>主C</b> ' + esc(c.carry) + (carryItems.length ? ' <span class="dim">(' + esc(carryItems.join("、")) + ")</span>" : "") + "</div>" : "") +
        (have.length ? '<div class="lbl">已有</div><div class="chips">' + have.map(function (u) { return unitChip(u, "have"); }).join("") + "</div>" : "") +
        (miss.length ? '<div class="lbl">还缺</div><div class="chips">' + miss.map(function (u) { return unitChip(u, "miss"); }).join("") + "</div>" : "") +
        (cont.length ? '<div class="contest">有人在玩相同棋子：' + esc(cont.join("、")) + "</div>" : "") +
        (has(c.reason) ? '<div class="reason">' + esc(c.reason) + "</div>" : "") + "</div>";
    }).join(""));
  }

  function renderItems() {
    var items = arr(g(S, "analysis.items", [])).filter(function (x) { return x && typeof x === "object"; });
    var plan = g(S, "advice.items", "");
    var html = has(plan) ? '<div style="margin-bottom:6px">' + esc(plan) + "</div>" : "";
    if (!items.length && !html) { setHTML("items", empty("暂无装备建议")); return; }
    html += items.slice(0, 8).map(function (it) {
      var comps = arr(it.components);
      return '<div class="item">' + (num(it.priority) === 1 ? '<span class="now">现在合</span>' : "") +
        '<div><div class="nm">' + esc(it.item) + (has(it.holder) ? ' <span class="dim" style="font-weight:500">给 ' + esc(it.holder) + "</span>" : "") + "</div>" +
        (comps.length ? '<div class="cp">' + esc(comps.join(" + ")) + "</div>" : "") +
        (has(it.reason) ? '<div class="cp">' + esc(it.reason) + "</div>" : "") + "</div></div>";
    }).join("");
    setHTML("items", html);
  }

  function renderOpponents() {
    var st = S.state || {};
    var opps = st.opponents && typeof st.opponents === "object" ? st.opponents : {};
    var list = Object.keys(opps).map(function (k) { var o = opps[k] || {}; if (!o.player) o.player = k; return o; });
    list.sort(function (a, b) { return (num(b.captured_at) || 0) - (num(a.captured_at) || 0); });
    var players = arr(st.players).filter(function (p) { return p && p.name; });
    var html = "";
    if (players.length) {
      html += '<div class="players">' + players.map(function (p) {
        var isMe = p.is_self || (st.self_name && p.name === st.self_name);
        var seen = !!opps[p.name];
        var dead = num(p.hp) !== null && p.hp <= 0;
        return '<button class="pl' + (isMe ? " me" : "") + (seen ? " seen" : "") + (dead ? " dead" : "") + '"' +
          (isMe || dead ? " disabled" : ' data-scout-player="' + esc(p.name) + '"') + ">" +
          esc(p.name) + (num(p.hp) !== null ? ' <span class="dim">' + p.hp + "</span>" : "") + (seen ? " ✓" : "") + "</button>";
      }).join("") + "</div>";
    }
    if (!list.length) {
      html += empty("还没有记录对手。在游戏里点开对手的棋盘，再按 F7 或点上面的玩家名。");
    } else {
      html += list.slice(0, 8).map(function (o) {
        var board = arr(o.board);
        var meta = [];
        if (o.stage) meta.push("回合 " + esc(o.stage));
        if (num(o.level) !== null) meta.push(o.level + " 级");
        if (num(o.hp) !== null) meta.push("血量 " + o.hp);
        meta.push(fmtAge(o.captured_at));
        var traits = arr(o.traits).filter(function (t) { return t && t.active; });
        return '<div class="opp"><div class="top"><span class="name">' + esc(o.player) + '</span><span class="dim" style="font-size:13px">' +
          meta.filter(Boolean).join("，") + "</span></div>" +
          (board.length ? '<div class="chips" style="margin-top:6px">' + board.map(function (u) { return unitChip(u); }).join("") + "</div>" : empty("没有看到棋子")) +
          (traits.length ? '<div class="dim" style="font-size:13px;margin-top:4px">' + esc(traits.map(function (t) { return t.name + " " + t.count; }).join("、")) + "</div>" : "") +
          "</div>";
      }).join("");
    }
    setHTML("opponents", html);
  }

  function renderSeen() {
    var st = S.state || {};
    var status = S.status || {};
    var html = "";
    var board = arr(st.board), bench = arr(st.bench), itemBench = arr(st.item_bench);
    var traits = arr(st.traits).filter(function (t) { return t && t.name; });
    traits.sort(function (a, b) { return (b.active ? 1 : 0) - (a.active ? 1 : 0) || (num(b.count) || 0) - (num(a.count) || 0); });
    html += '<div class="lbl">场上 (' + board.length + ")</div>" + (board.length ? '<div class="chips">' + board.map(function (u) { return unitChip(u); }).join("") + "</div>" : empty("无"));
    html += '<div class="lbl">备战席 (' + bench.length + ")</div>" + (bench.length ? '<div class="chips">' + bench.map(function (u) { return unitChip(u); }).join("") + "</div>" : empty("无"));
    if (itemBench.length) html += '<div class="lbl">未装备的装备</div><div class="chips">' + itemBench.map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div>";
    if (traits.length) html += '<div class="lbl">羁绊</div><div class="chips">' + traits.slice(0, 14).map(function (t) {
      return '<span class="chip' + (t.active ? " have" : " miss") + '">' + esc(t.name) + " " + esc(t.count) + (num(t.next_breakpoint) ? '<span class="faint">/' + t.next_breakpoint + "</span>" : "") + "</span>";
    }).join("") + "</div>";
    var augs = arr(st.augments), choices = arr(st.augment_choices);
    if (augs.length) html += '<div class="lbl">已选海克斯</div><div class="chips">' + augs.map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") + "</div>";
    if (choices.length) html += '<div class="lbl">可选海克斯</div><div class="chips">' + choices.map(function (x) { return '<span class="chip pick">' + esc(x) + "</span>"; }).join("") + "</div>";
    setHTML("seen", html);
    var sub = [];
    if (num(st.last_update)) sub.push("更新于 " + fmtAge(st.last_update));
    if (status.data_source) sub.push("数据: " + dataSourceLabel(status.data_source));
    $("seen-sub").textContent = sub.join("，");
  }

  function renderWarnings() {
    var w = arr(g(S, "analysis.warnings", [])).filter(has);
    var status = S.status || {};
    var items = w.map(function (x) { return "<li>" + esc(x) + "</li>"; });
    if (status.perceiver === "manual") items.push('<li class="bad">没有 Claude API Key 也没有 OCR，助手看不到游戏画面：「分析」「读商店」「记录对手」不会读到新数据。请设置 ANTHROPIC_API_KEY 后重启，或在「手动修正」里输入金币、等级、血量。</li>');
    if (has(status.last_error)) items.push('<li class="bad">最近错误：' + esc(status.last_error) + "</li>");
    var lu = num(g(S, "state.last_update", null));
    if (lu && nowS() - lu > 300 && status.auto) items.push("<li>已经超过 5 分钟没有读到新画面，检查游戏窗口是否在前台</li>");
    setHTML("warnings", items.length ? '<ul class="warnlist">' + items.join("") + "</ul>" : empty("暂无提醒"));
  }

  function renderAnswer() {
    var a = S.answer;
    var el = $("answer");
    if (lastAskTs && (!a || !num(a.ts) || a.ts < lastAskTs - 2)) {
      if (nowS() - lastAskTs > ASK_TIMEOUT_S) {
        setHTML(el, '<div class="answer warn">等了 2 分钟还没有回答，可以再问一次，或看看下面的日志</div>');
      } else {
        setHTML(el, '<div class="answer dim">Claude 思考中...</div>');
      }
      return;
    }
    if (!a || typeof a !== "object" || !has(a.answer)) { setHTML(el, ""); return; }
    lastAskTs = 0;
    setHTML(el, '<div class="answer">' + (has(a.question) ? '<div class="q">问：' + esc(a.question) + "</div>" : "") + esc(a.answer) + "</div>");
  }

  function renderAsk() {
    var off = g(S, "status.strategist", null) === false; // no Claude: asking only returns an error
    var q = $("ask-q"), b = $("ask-btn");
    if (q.disabled === off) return;
    q.disabled = off;
    b.disabled = off;
    q.placeholder = off ? "需要 API Key 才能提问：设置 ANTHROPIC_API_KEY 后重启助手" : ASK_PLACEHOLDER;
    $("ask-sub").textContent = off ? "需要 API Key" : "";
  }

  function renderLog() {
    var lg = arr(S.log).filter(function (x) { return x && typeof x === "object"; });
    $("log-sub").textContent = lg.length ? lg.length + " 条" : "";
    if (!lg.length) { setHTML("log", '<div class="faint">暂无日志</div>'); return; }
    setHTML("log", lg.slice(-60).reverse().map(function (x) {
      var lvl = x.level === "error" ? "error" : x.level === "warn" ? "warn" : "";
      return '<div class="' + lvl + '"><span class="t">' + fmtClock(x.ts) + "</span>" + esc(x.text) + "</div>";
    }).join(""));
  }

  // ------------------------------------------------------------------ inputs
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    while (t && t !== document && !(t.getAttribute && (t.getAttribute("data-cmd") || t.hasAttribute("data-req-scout") || t.hasAttribute("data-req-dismiss") || t.hasAttribute("data-scout-player")))) {
      t = t.parentNode;
    }
    if (!t || t === document) return;
    var cmd = t.getAttribute("data-cmd");
    if (cmd) {
      if (cmd === "new_game" && !window.confirm("确定开始新对局？会清空当前对局的记录。")) return;
      send({ cmd: cmd }, t.getAttribute("data-label") || cmd);
      return;
    }
    if (t.hasAttribute("data-req-scout")) {
      var who = t.getAttribute("data-player") || "";
      send({ cmd: "scout", player: who || null }, "记录 " + (who || "对手"));
      return;
    }
    if (t.hasAttribute("data-req-dismiss")) {
      var rid = t.getAttribute("data-id") || "";
      if (rid) send({ cmd: "dismiss", id: rid }, "忽略请求");
      return;
    }
    if (t.hasAttribute("data-scout-player")) {
      var name = t.getAttribute("data-scout-player");
      send({ cmd: "scout", player: name }, "记录 " + name);
    }
  });

  function ask() {
    var q = $("ask-q").value.replace(/^\s+|\s+$/g, "");
    if (!q) { toast("先写下你的问题", "bad"); return; }
    send({ cmd: "ask", question: q.slice(0, 500) }, "提问").then(function (ok) {
      if (ok) { lastAskTs = nowS(); renderAnswer(); }
    });
  }
  $("ask-btn").addEventListener("click", ask);
  $("ask-q").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); ask(); }
  });

  $("fix-field").addEventListener("change", function () {
    var f = $("fix-field").value;
    // Phone number pads have no minus sign: a losing streak needs the text keyboard.
    $("fix-value").setAttribute("inputmode", f === "stage" || f === "streak" ? "text" : "numeric");
    $("fix-value").placeholder = FIX_HINT[f] || "新数值";
  });
  function fix() {
    var field = $("fix-field").value;
    var raw = $("fix-value").value.replace(/\s+/g, "");
    var value;
    if (field === "stage") {
      raw = raw.replace(/[‐-―−:－]/g, "-");
      if (!/^\d{1,2}-\d{1,2}$/.test(raw)) { toast("阶段格式应为 3-2", "bad"); return; }
      value = raw;
    } else {
      raw = raw.replace(/^[‐-―−－]/, "-"); // minus typed with a Chinese IME
      if (!/^-?\d{1,3}$/.test(raw)) { toast("请输入整数", "bad"); return; }
      value = parseInt(raw, 10);
      var rg = FIELD_RANGE[field];
      if (rg && (value < rg[0] || value > rg[1])) {
        toast("修正失败：" + (FIELD_LABEL[field] || field) + " " + value + " 不合理（范围 " + rg[0] + " 到 " + rg[1] + "）", "bad");
        return;
      }
    }
    send({ cmd: "set_field", field: field, value: value }, "修正" + (FIELD_LABEL[field] || field) + " = " + value, "修正失败").then(function (ok) {
      if (ok) $("fix-value").value = "";
    });
  }
  $("fix-btn").addEventListener("click", fix);
  $("fix-value").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); fix(); } });

  function setComp() {
    var v = $("comp-value").value.replace(/^\s+|\s+$/g, "").slice(0, 200);
    send({ cmd: "set_comp", comp: v }, v ? "目标阵容 " + v : "目标阵容 自动", "设定失败");
  }
  $("comp-btn").addEventListener("click", setComp);
  $("comp-value").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); setComp(); } });

  // refresh relative times
  setInterval(function () {
    safe("headline-age", function () { if (S.advice) $("hl-age").textContent = fmtAge(S.advice.created_at); });
    safe("seen", renderSeen);
    safe("answer", renderAnswer);
    if (connMode === "down") refreshBanner(); // keeps "N 秒前" current
  }, 5000);

  // ------------------------------------------------------------------ boot
  $("ask-q").placeholder = ASK_PLACEHOLDER;
  setConn("");
  syncClock();
  poll();
  connect();
})();
</script>
</body>
</html>
