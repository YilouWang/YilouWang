<svg width="840" height="250" viewBox="0 0 840 250" fill="none" xmlns="http://www.w3.org/2000/svg" xml:space="preserve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="840" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="839" height="249" rx="12"/></clipPath>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(216px); } }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 12px; white-space: pre; }
    .win-title { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
    .prompt { fill: #10b981; font-weight: bold; }
    .cmd { fill: #e2e8f0; }
    .arg { fill: #38bdf8; }
    .info { fill: #34d399; }
    .meta { fill: #64748b; }
    .id { fill: #f59e0b; }
    .id-ai { fill: #a78bfa; }
    .msg { fill: #e2e8f0; }
    .num { fill: #38bdf8; font-weight: bold; }
    .sum { fill: #94a3b8; }
    .zero { fill: #34d399; font-weight: bold; }
    .pass { fill: #10b981; font-weight: bold; font-size: 13px; }
    .cursor { fill: #10b981; animation: blink 1s infinite; }
    .scan { fill: #38bdf8; opacity: 0.05; animation: scan 6s infinite linear; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="840" height="250" fill="url(#bg)"/>

    <!-- 窗口标题栏 -->
    <rect width="840" height="34" fill="#0f172a"/>
    <line x1="0" y1="34" x2="840" y2="34" stroke="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#f43f5e"/>
    <circle cx="38" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="17" r="5" fill="#10b981"/>
    <text x="420" y="21" class="mono win-title">sim.log · highlights</text>

    <!-- 扫描光带 -->
    <rect x="0" y="34" width="840" height="14" class="scan"/>

    <text x="20" y="62" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd"> make sim </tspan><tspan class="arg">TEST=yilou_career_test SIM=verilator</tspan></text>

    <text x="20" y="88" class="mono"><tspan class="info">UVM_INFO</tspan><tspan class="meta"> @ 2026: uvm_test_top </tspan><tspan class="id">[VERILATOR]</tspan><tspan class="msg">  </tspan><tspan class="num">160+</tspan><tspan class="msg"> merged PRs · Verilator org member</tspan></text>
    <text x="20" y="108" class="mono"><tspan class="info">UVM_INFO</tspan><tspan class="meta"> @ 2026: uvm_test_top </tspan><tspan class="id-ai">[AGENTIC]</tspan><tspan class="msg">    </tspan><tspan class="num">82</tspan><tspan class="msg"> merged PRs in 3 months · human review on every patch</tspan></text>
    <text x="20" y="128" class="mono"><tspan class="info">UVM_INFO</tspan><tspan class="meta"> @ 2026: uvm_test_top </tspan><tspan class="id">[CORE-V]</tspan><tspan class="msg">     cv32e40p UVM testbench running natively on Verilator</tspan></text>
    <text x="20" y="148" class="mono"><tspan class="info">UVM_INFO</tspan><tspan class="meta"> @ 2026: uvm_test_top </tspan><tspan class="id">[WRITING]</tspan><tspan class="msg">    </tspan><tspan class="num">7</tspan><tspan class="msg"> blog posts · </tspan><tspan class="num">4</tspan><tspan class="msg"> papers &amp; talks</tspan></text>

    <text x="20" y="180" class="mono sum">--- UVM Report Summary ---</text>
    <text x="20" y="200" class="mono"><tspan class="sum">UVM_INFO : </tspan><tspan class="num">4</tspan><tspan class="sum">    UVM_WARNING : </tspan><tspan class="zero">0</tspan><tspan class="sum">    UVM_ERROR : </tspan><tspan class="zero">0</tspan><tspan class="sum">    UVM_FATAL : </tspan><tspan class="zero">0</tspan></text>

    <text x="20" y="228" class="mono pass" filter="url(#glow)">TEST PASSED ✔</text>
    <rect x="132" y="217" width="8" height="14" class="cursor"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="249" rx="12" stroke="url(#border)" stroke-width="1" stroke-opacity="0.7"/>
</svg>
